    <script>
        const firebaseConfig = { apiKey: "AIzaSyAvVMu2xPpZGY2acNzn2A9QfxnQy_J3IZI", authDomain: "open-close-11f8d.firebaseapp.com", databaseURL: "https://open-close-11f8d-default-rtdb.firebaseio.com", projectId: "open-close-11f8d" };
        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        const database = firebase.database();

        let dbDesign = []; let dbProducts = []; let dbPromoCodes = [];
        let currentSelectedProduct = null; 
        let cart = []; 
        let appliedPromo = null;

        function formatPrice(priceStr, discount) {
            let str = String(priceStr || '').trim();
            if(str.startsWith('http') || str.startsWith('wa.me')) {
                let link = str.startsWith('wa.me') ? 'https://' + str : str;
                return { isLink: true, html: `<a href="${link}" target="_blank" style="color:#3498db; text-decoration:none; font-weight:bold;"><i class="fa-brands fa-whatsapp"></i> تواصل للسعر</a>`, val: 0, textVal: 'تواصل للسعر' };
            }
            if(isNaN(str) && str !== '') { return { isLink: false, html: `${str} ج.م`, val: parseFloat(str) || 0, textVal: str }; }
            let num = parseFloat(str) || 0;
            if(discount > 0) { let fin = num - (num * discount / 100); return { isLink: false, html: `<del style="color:#888; font-size:12px;">${num}</del> ${fin} ج.م`, val: fin, textVal: fin }; }
            return { isLink: false, html: `${num} ج.م`, val: num, textVal: num };
        }

        function toggleMute(btn) {
            let video = btn.previousElementSibling;
            if(video && video.tagName === 'VIDEO') {
                video.muted = !video.muted;
                btn.innerHTML = video.muted ? '<i class="fa-solid fa-volume-xmark"></i>' : '<i class="fa-solid fa-volume-high"></i>';
            }
        }

        // صورة بديلة لو صورة المنتج ناقصة أو بايظة
        const PLACEHOLDER_IMG = "data:image/svg+xml," + encodeURIComponent("<svg xmlns='http://www.w3.org/2000/svg' width='300' height='200'><rect width='300' height='200' fill='#111'/><text x='150' y='110' font-size='22' text-anchor='middle' fill='#d4af37' font-family='Cairo,Arial'>فكرة خشبة</text></svg>");
        const isBrokenSrc = src => !src || (src.startsWith('data:') && (!src.includes(',') || src.length < 100));

        function createMediaElement(src, isMain = false, loop = true, alt = '') {
            if (isBrokenSrc(src)) src = PLACEHOLDER_IMG;
            let loopAttr = loop ? 'loop' : '';
            if (src.includes('drive.google.com')) {
                let idMatch = src.match(/\/d\/(.+?)\//) || src.match(/id=(.+?)(&|$)/);
                let id = idMatch ? idMatch[1] : '';
                if(id) return `<iframe src="https://drive.google.com/file/d/${id}/preview" style="width:100%; height:100%; border:none; border-radius:5px;" allow="autoplay"></iframe>`;
            } else if (src.startsWith('data:video') || src.match(/\.(mp4|webm|ogg)$/i)) {
                let muteBtnHtml = isMain ? `<button class="mute-btn" onclick="toggleMute(this)"><i class="fa-solid fa-volume-xmark"></i></button>` : '';
                let vidHtml = `<video src="${src}" ${isMain ? 'autoplay muted playsinline ' : 'muted playsinline '} ${loopAttr} style="width:100%; height:100%; object-fit:${isMain?'contain':'cover'}; border-radius:5px; pointer-events:${isMain?'auto':'none'};"></video>`;
                return isMain ? `<div style="position:relative; width:100%; height:100%; overflow:hidden;">${vidHtml}${muteBtnHtml}</div>` : vidHtml;
            }
            let safeAlt = String(alt).replace(/"/g, '&quot;');
            return `<img src="${src}" alt="${safeAlt}" ${isMain ? '' : 'loading="lazy" decoding="async"'} onerror="this.onerror=null; this.src=PLACEHOLDER_IMG;" style="width:100%; height:100%; object-fit:${isMain?'contain':'cover'}; border-radius:5px; transition:0.3s; pointer-events:${isMain?'auto':'none'};">`;
        }

        function getTagsHtml(labelString) {
            if (!labelString) return '';
            return labelString.split(',').map(t => t.trim()).filter(t => t !== '').map(tag => `<span class="tag-badge">${tag}</span>`).join('');
        }

        database.ref('storeData').on('value', snapshot => {
            const data = snapshot.val() || { design: [], products: [], promoCodes: [] };
            let rDesign = data.design || []; let rProds = data.products || []; let rPromo = data.promoCodes || [];
            
            dbDesign = (Array.isArray(rDesign) ? rDesign : Object.values(rDesign)).filter(i => i !== null);
            dbProducts = (Array.isArray(rProds) ? rProds : Object.values(rProds)).filter(i => i !== null);
            dbPromoCodes = (Array.isArray(rPromo) ? rPromo : Object.values(rPromo)).filter(i => i !== null);
            
            renderHero(); renderAllProducts();
            if(document.getElementById('searchInput').value !== '') { filterProducts(); }
            
            const urlParams = new URLSearchParams(window.location.search);
            const sharedProdId = urlParams.get('product');
            if(sharedProdId && !window.sharedProductOpened && dbProducts.length > 0) {
                window.sharedProductOpened = true;
                setTimeout(() => openProductDetails(sharedProdId), 400);
            }
        });

        function scrollSlider(id, amount) { document.getElementById(id).scrollBy({ left: amount, behavior: 'smooth' }); }

        // التحديث الجديد: عرض العناصر بشكل مرتب وتسلسلي (مفيش بناء حر ولا X و Y)
        function renderHero() {
            const hero = document.getElementById('hero-section');
            if(!dbDesign || dbDesign.length === 0) { hero.style.display = 'none'; return; }
            hero.style.display = 'flex'; 
            let html = ''; 

            dbDesign.forEach(el => {
                let wrapperStyle = `width: 100%; max-width: 1000px; text-align: center;`;
                
                if(el.type === 'banner') { 
                    let mediaHtml = createMediaElement(el.content, true, el.loop);
                    html += `<div class="hero-element-wrapper" style="${wrapperStyle} border-radius:10px; box-shadow: 0 5px 15px rgba(0,0,0,0.5); overflow:hidden; background:#000;">${mediaHtml}</div>`; 
                } 
                else if (el.type === 'button') { 
                    html += `<div class="hero-element-wrapper" style="${wrapperStyle}"><a href="${el.link}" target="_blank" style="background: ${el.color || 'var(--gold)'}; color: #000; padding: 15px 30px; border-radius: 30px; font-weight: bold; text-decoration: none; display: inline-block; width: 100%; max-width: 300px;">${el.text}</a></div>`; 
                } 
                else if (el.type === 'text') { 
                    html += `<div class="hero-element-wrapper" style="${wrapperStyle} color: ${el.color || 'var(--gold)'}; font-size: 24px; font-weight: bold;">${el.text}</div>`; 
                }
                else if (el.type === 'product_widget') {
                    let prod = dbProducts.find(p => p.id == el.productId);
                    if(prod) {
                        let badge = prod.discount ? `<div class="discount-badge">خصم ${prod.discount}%</div>` : '';
                        let pData = formatPrice(prod.price, prod.discount);
                        let displayMedia = prod.video || prod.image;
                        html += `
                        <div class="hero-element-wrapper slider-card" style="width: 100%; max-width: 300px; margin: 0 auto;" onclick="openProductDetails('${prod.id}')">
                            ${badge}
                            <div style="width:100%; height:200px;">${createMediaElement(displayMedia, false, prod.mediaLoop, prod.name)}</div>
                            <div style="padding:15px; text-align:center;">
                                <div class="tags-container">${getTagsHtml(prod.label)}</div>
                                <h4 style="color:white; margin:0 0 10px 0;">${prod.name}</h4>
                                <div style="color:var(--gold); font-weight:bold; font-size:18px;">${pData.html}</div>
                            </div>
                        </div>`;
                    }
                }
                else if (el.type === 'slider') {
                    let filtered = el.filterType === 'latest' ? dbProducts.slice().reverse() : (el.filterType === 'label' ? dbProducts.filter(p => (p.label || '').toLowerCase().includes((el.filterValue || '').toLowerCase())) : dbProducts);
                    let sliderHtml = `<div class="hero-element-wrapper" style="${wrapperStyle}"><h2 style="color: var(--gold); margin-bottom: 20px; border-right: 4px solid var(--gold); padding-right: 15px; text-align: right;">${el.title}</h2>
                    <div class="slider-wrapper">
                        <button class="slider-arrow right" onclick="scrollSlider('slider-${el.id}', -250)"><i class="fa-solid fa-chevron-right"></i></button>
                        <div class="slider-container" id="slider-${el.id}">`;
                    
                    filtered.forEach(p => {
                        let badge = p.discount ? `<div class="discount-badge">خصم ${p.discount}%</div>` : '';
                        let pData = formatPrice(p.price, p.discount);
                        let displayMedia = p.video || p.image;
                        sliderHtml += `<div class="slider-card" onclick="openProductDetails('${p.id}')">${badge}<div style="width:100%; height:160px;">${createMediaElement(displayMedia, false, p.mediaLoop, p.name)}</div><div style="padding: 15px; text-align: center;"><div class="tags-container">${getTagsHtml(p.label)}</div><h4 style="color: white; margin: 0 0 10px 0;">${p.name}</h4><div style="color: var(--gold); font-weight: bold; font-size: 18px;">${pData.html}</div></div></div>`;
                    });
                    if(filtered.length === 0) sliderHtml += `<p style="color:#666; width:100%;">لا توجد منتجات.</p>`;
                    
                    sliderHtml += `</div><button class="slider-arrow left" onclick="scrollSlider('slider-${el.id}', 250)"><i class="fa-solid fa-chevron-left"></i></button></div></div>`; 
                    html += sliderHtml;
                }
            });
            hero.innerHTML = html; 
        }

        function renderAllProducts() {
            const container = document.getElementById('allProductsGrid');
            if (!dbProducts || dbProducts.length === 0) { container.innerHTML = '<p style="color:#666; text-align:center; width:100%;">لا توجد منتجات حالياً.</p>'; return; }
            let html = '';
            [...dbProducts].reverse().forEach(p => {
                let badge = p.discount ? `<div class="discount-badge">خصم ${p.discount}%</div>` : '';
                let pData = formatPrice(p.price, p.discount);
                let displayMedia = p.video || p.image;
                html += `<div class="slider-card" style="width: 100%; max-width: none;" onclick="openProductDetails('${p.id}')">${badge}<div style="width:100%; height:200px;">${createMediaElement(displayMedia, false, p.mediaLoop, p.name)}</div><div style="padding:15px; text-align:center;"><div class="tags-container">${getTagsHtml(p.label)}</div><h4 style="color:white; margin:0 0 10px 0;">${p.name}</h4><div style="color:var(--gold); font-weight:bold; font-size:18px;">${pData.html}</div></div></div>`;
            });
            container.innerHTML = html;
        }

        function filterProducts() {
            const term = document.getElementById('searchInput').value.toLowerCase();
            const resultsDiv = document.getElementById('searchResults'); const grid = document.getElementById('productsGrid'); const hero = document.getElementById('hero-section'); const allProductsSection = document.getElementById('allProductsContainer');
            if(term === '') { resultsDiv.style.display = 'none'; hero.style.display = 'flex'; allProductsSection.style.display = 'block'; return; }
            hero.style.display = 'none'; allProductsSection.style.display = 'none'; resultsDiv.style.display = 'block';
            
            const filtered = dbProducts.filter(p => (p.name && p.name.toLowerCase().includes(term)) || (p.label && p.label.toLowerCase().includes(term)));
            if(filtered.length === 0) { grid.innerHTML = '<p style="color: #666; text-align:center; width:100%;">لا توجد منتجات مطابقة.</p>'; return; }
            
            let html = '';
            filtered.forEach(p => {
                let badge = p.discount ? `<div class="discount-badge">خصم ${p.discount}%</div>` : '';
                let pData = formatPrice(p.price, p.discount);
                let displayMedia = p.video || p.image;
                html += `<div class="slider-card" onclick="openProductDetails('${p.id}')" style="width: 100%; max-width: none;">${badge}<div style="width:100%; height:200px;">${createMediaElement(displayMedia, false, p.mediaLoop, p.name)}</div><div style="padding:15px; text-align:center;"><div class="tags-container">${getTagsHtml(p.label)}</div><h4 style="color:white; margin:0 0 10px 0;">${p.name}</h4><div style="color:var(--gold); font-weight:bold; font-size:18px;">${pData.html}</div></div></div>`;
            });
            grid.innerHTML = html;
        }

        function openProductDetails(id) {
            const p = dbProducts.find(prod => prod.id == id);
            if(!p) return;
            
            let mainMediaSrc = p.video || p.image;
            document.getElementById('mediaViewer').innerHTML = createMediaElement(mainMediaSrc, true, p.mediaLoop, p.name);
            
            document.getElementById('detailTags').innerHTML = getTagsHtml(p.label);
            document.getElementById('detailName').innerText = p.name;
            document.getElementById('detailDesc').innerText = p.desc ? p.desc : '';
            document.getElementById('detailMaterial').innerText = p.material ? 'الخامات: ' + p.material : '';
            document.getElementById('detailMaterial').style.display = p.material ? 'block' : 'none';

            let pData = formatPrice(p.price, p.discount);
            if (pData.isLink) { document.getElementById('detailPrice').innerHTML = pData.html; } 
            else {
                let dBadge = (p.discount && !isNaN(p.price)) ? `<span style="background:#e74c3c; color:white; font-size:12px; padding:3px 8px; border-radius:5px; margin-right:10px;">خصم ${p.discount}%</span>` : '';
                document.getElementById('detailPrice').innerHTML = pData.html + ' ' + dBadge;
            }
            
            let galleryHtml = '';
            if(p.video) {
                let isDrive = p.video.includes('drive');
                let iconStr = isDrive ? '<i class="fa-brands fa-google-drive" style="color:white; font-size:24px;"></i>' : '<i class="fa-solid fa-video" style="color:white; font-size:24px;"></i>';
                galleryHtml += `<div onclick="changeMainMedia('${p.video}', ${p.mediaLoop})" style="width:60px; height:60px; border-radius:5px; cursor:pointer; border:2px solid var(--gold); display:flex; align-items:center; justify-content:center; background:#222; flex-shrink:0;">${iconStr}</div>`;
            }

            if(p.image) { galleryHtml += `<div onclick="changeMainMedia('${p.image}', false)" style="width:60px; height:60px; cursor:pointer; flex-shrink:0;">${createMediaElement(p.image, false)}</div>`; }
            
            if(p.extraImages && p.extraImages.length > 0) { 
                p.extraImages.forEach(extSrc => { galleryHtml += `<div onclick="changeMainMedia('${extSrc}', false)" style="width:60px; height:60px; cursor:pointer; flex-shrink:0;">${createMediaElement(extSrc, false)}</div>`; }); 
            }
            
            document.getElementById('detailGallery').innerHTML = galleryHtml;
            document.getElementById('productSpecificNote').value = '';
            document.getElementById('shareProductBtn').onclick = () => shareProductUrl(p.id);
            
            currentSelectedProduct = { ...p, pData: pData };
            document.getElementById('productModal').style.display = 'flex';
        }

        function changeMainMedia(src, loop) { document.getElementById('mediaViewer').innerHTML = createMediaElement(src, true, loop); }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; if(id === 'productModal') document.getElementById('mediaViewer').innerHTML = ''; }
        
        function shareProductUrl(id) {
            const url = window.location.origin + window.location.pathname + '?product=' + id;
            if (navigator.clipboard) {
                navigator.clipboard.writeText(url).then(() => showToast('تم نسخ رابط المنتج بنجاح!')).catch(() => prompt("انسخ الرابط التالي:", url));
            } else { prompt("انسخ الرابط التالي:", url); }
        }
        
        function addToCart() { 
            let note = document.getElementById('productSpecificNote').value;
            cart.push({ ...currentSelectedProduct, finalPrice: currentSelectedProduct.pData.val, priceText: currentSelectedProduct.pData.textVal || currentSelectedProduct.pData.html, isLink: currentSelectedProduct.pData.isLink, note: note });
            document.getElementById('cartCount').innerText = cart.length;
            showToast('تمت إضافة المنتج للسلة بنجاح!'); closeModal('productModal'); 
        }

        function openCart() { 
            appliedPromo = null;
            document.getElementById('promoCodeInput').value = '';
            document.getElementById('promoMessage').innerHTML = '';
            renderCartItems(); 
            document.getElementById('cartModal').style.display = 'flex'; 
        }

        // --- نظام كوبون الخصم والسلة ---
        function applyPromoCode() {
            let code = document.getElementById('promoCodeInput').value.trim().toUpperCase();
            let msgBox = document.getElementById('promoMessage');
            
            if(!code) {
                appliedPromo = null;
                msgBox.innerHTML = '';
                renderCartItems();
                return;
            }

            let promo = dbPromoCodes.find(p => p.code === code && p.active !== false);
            if(!promo) {
                msgBox.innerHTML = '<span style="color:var(--red);"><i class="fa-solid fa-circle-xmark"></i> كود غير صحيح أو غير مفعل.</span>';
                appliedPromo = null;
                renderCartItems();
                return;
            }

            if(promo.expiry) {
                let today = new Date().toISOString().split('T')[0];
                if(promo.expiry < today) {
                    msgBox.innerHTML = '<span style="color:var(--red);"><i class="fa-solid fa-clock"></i> عذراً، هذا الكود منتهي الصلاحية.</span>';
                    appliedPromo = null;
                    renderCartItems();
                    return;
                }
            }

            appliedPromo = promo;
            msgBox.innerHTML = `<span style="color:var(--accent); font-weight:bold;"><i class="fa-solid fa-circle-check"></i> تم تطبيق الخصم بنجاح!</span>`;
            renderCartItems();
        }

        function renderCartItems() {
            const list = document.getElementById('cartItemsList');
            const promoContainer = document.getElementById('promoContainer');
            const form = document.getElementById('checkoutForm');
            const totalsDiv = document.getElementById('cartTotals');

            if(cart.length === 0) { 
                list.innerHTML = '<p style="text-align:center; color:#666;">السلة فارغة حالياً.</p>'; 
                form.style.display = 'none'; 
                promoContainer.style.display = 'none';
                totalsDiv.innerHTML = '';
                return; 
            }

            form.style.display = 'block';
            promoContainer.style.display = 'flex';

            let html = ''; let subtotal = 0;
            cart.forEach((item, index) => {
                subtotal += item.finalPrice;
                let displayMedia = item.image || item.video || '';
                let displayPrice = item.isLink ? `<span style="font-size:12px;">استفسار سعر</span>` : `${item.priceText} ج.م`;
                html += `<div style="display:flex; justify-content:space-between; align-items:center; background:#1a1a1a; padding:10px; border-radius:8px; margin-bottom:10px;">
                            <div style="display:flex; gap:10px; align-items:center;">
                                <div style="width:40px; height:40px; pointer-events:none;">${createMediaElement(displayMedia)}</div>
                                <div><div style="color:white; font-size:14px; font-weight:bold;">${item.name}</div>${item.note ? `<div style="color:#aaa; font-size:11px;">ملاحظة: ${item.note}</div>` : ''}</div>
                            </div>
                            <div style="display:flex; align-items:center; gap:15px;"><span style="color:var(--gold); font-weight:bold; font-size:14px;">${displayPrice}</span><button type="button" onclick="removeFromCart(${index})" style="background:transparent; border:none; color:#e74c3c; cursor:pointer; font-size: 16px;"><i class="fa-solid fa-trash"></i></button></div>
                        </div>`;
            });
            list.innerHTML = html;

            // حسابات الفاتورة
            let discountAmount = 0;
            if(appliedPromo && subtotal > 0) {
                if(appliedPromo.type === 'percent') {
                    discountAmount = subtotal * (appliedPromo.value / 100);
                } else {
                    discountAmount = appliedPromo.value;
                }
            }

            let finalTotal = Math.max(0, subtotal - discountAmount);

            let totalsHtml = `
                <div style="border-top:1px solid #333; padding-top:15px; font-size:14px;">
                    <div style="display:flex; justify-content:space-between; margin-bottom:8px;">
                        <span style="color:#ccc;">إجمالي المنتجات:</span>
                        <span style="font-weight:bold;">${subtotal} ج.م</span>
                    </div>
            `;

            if(discountAmount > 0) {
                totalsHtml += `
                    <div style="display:flex; justify-content:space-between; margin-bottom:8px; color:var(--accent);">
                        <span>قيمة الخصم (${appliedPromo.code}):</span>
                        <span style="font-weight:bold;">- ${discountAmount} ج.م</span>
                    </div>
                `;
            }

            totalsHtml += `
                    <div style="display:flex; justify-content:space-between; margin-top:10px; padding-top:10px; border-top:1px dashed #333; font-size:18px; color:var(--gold); font-weight:bold;">
                        <span>الإجمالي النهائي:</span>
                        <span>${finalTotal} ج.م</span>
                    </div>
                </div>
            `;

            totalsDiv.innerHTML = totalsHtml;
        }

        function removeFromCart(index) { 
            cart.splice(index, 1); 
            document.getElementById('cartCount').innerText = cart.length; 
            renderCartItems(); 
        }

        function submitOrder(e) { 
            e.preventDefault(); 
            if(cart.length === 0) return;
            const inputs = e.target.querySelectorAll('input');
            const name = inputs[0].value; const phone = inputs[1].value; const address = inputs[2].value;
            const globalNote = document.getElementById('globalOrderNote').value;
            
            let subtotal = cart.reduce((sum, item) => sum + item.finalPrice, 0);
            let discountAmount = 0;
            if(appliedPromo && subtotal > 0) {
                discountAmount = appliedPromo.type === 'percent' ? subtotal * (appliedPromo.value / 100) : appliedPromo.value;
            }
            let finalTotal = Math.max(0, subtotal - discountAmount);

            const orderData = { 
                customerName: name, 
                customerPhone: phone, 
                address: address, 
                cartItems: cart, 
                note: globalNote || 'لا توجد تفاصيل إضافية', 
                totalPrice: finalTotal, // الإجمالي النهائي
                subTotal: subtotal, // الإجمالي قبل الخصم
                promoCode: appliedPromo ? appliedPromo.code : null, // الكود المستخدم
                promoDiscount: discountAmount, // قيمة الخصم اللي اتخصمت
                quantity: cart.length, 
                timestamp: Date.now(),
                orderState: 'active'
            };

            database.ref('orders').push(orderData).then((ref) => {
                alert('تم إرسال الطلب بنجاح! هنتواصل معاك قريباً لتأكيد الأوردر.'); 
                cart = []; document.getElementById('cartCount').innerText = 0;
                appliedPromo = null; document.getElementById('promoCodeInput').value = '';
                closeModal('cartModal'); e.target.reset(); 
                localStorage.setItem('fk_last_order', ref.key); localStorage.setItem('fk_last_notif_time', Date.now()); listenToMyOrder(ref.key);
            }).catch(error => { alert('حدث خطأ أثناء إرسال الطلب: ' + error.message); });
        }

        function showToast(message) {
            const container = document.getElementById('toast-container'); const toast = document.createElement('div'); toast.className = 'toast';
            toast.innerHTML = `<i class="fa-solid fa-bell"></i><div class="toast-content"><h4>إشعار جديد</h4><p>${message}</p></div>`; container.appendChild(toast);
            setTimeout(() => { toast.style.animation = 'slideOut 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards'; setTimeout(() => toast.remove(), 400); }, 6000);
        }

        let currentListenerRef = null;
        function listenToMyOrder(orderId) {
            if(currentListenerRef) currentListenerRef.off(); 
            currentListenerRef = database.ref('orders/' + orderId + '/latestNotification');
            currentListenerRef.on('value', snap => {
                const notif = snap.val();
                if(notif) { let lastSeen = localStorage.getItem('fk_last_notif_time') || 0; if(notif.timestamp > lastSeen) { showToast(notif.message); localStorage.setItem('fk_last_notif_time', notif.timestamp); } }
            });
        }

        if(localStorage.getItem('fk_last_order')) listenToMyOrder(localStorage.getItem('fk_last_order'));
    </script>
</body>
</html>
