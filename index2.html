<!DOCTYPE html>

<head>

    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23050505'/><text x='50' y='70' font-size='60' text-anchor='middle' fill='%23d4af37' font-family='Arial' font-weight='bold'>ف</text></svg>">

    <style>
        @font-face { font-family: 'BeIN'; src: local('BeIN Normal'), local('BeIN Arabic'), local('bein'); }
        :root { 
            --primary: #2c3e50; --secondary: #e74c3c; --bg: #f5f6fa; 
            --base-bg: #f0f0f0; --base-text: #333333; 
            --door-bg: #ffffff; --door-text: #000000; --mount-bg: #e0e0e0; 
        }
        body { font-family: 'BeIN', 'Cairo', sans-serif; background-color: var(--bg); margin: 0; padding: 0; display: flex; flex-direction: column; align-items: center; }
        .app-container { width: 100%; max-width: 600px; padding: 10px; box-sizing: border-box; display: flex; flex-direction: column; gap: 12px; }
        
        .scene-container, .scene-container * { user-select: none; -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; }
        
        header { background-color: white; padding: 10px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); display: flex; align-items: center; justify-content: center; gap: 10px; }
        header h1 { margin: 0; color: var(--primary); font-size: 20px; }
        header img { height: 35px; border-radius: 5px; }
        
        .scene-container { background: #ffffff; border-radius: 10px; box-shadow: inset 0 0 15px rgba(0,0,0,0.05), 0 4px 10px rgba(0,0,0,0.05); height: 250px; display: flex; justify-content: center; align-items: center; perspective: 1200px; overflow: hidden; touch-action: none; cursor: grab; }
        .scene-container:active { cursor: grabbing; }
        .rotate-wrapper { transform-style: preserve-3d; transform: rotateX(0deg) rotateY(0deg); }
        .sign-wrapper { position: relative; width: 480px; height: 70px; transform-style: preserve-3d; }
        .face { position: absolute; display: flex; justify-content: center; align-items: center; box-sizing: border-box; }
        
        .base { position: absolute; top: 0; left: 20px; width: 440px; height: 70px; transform-style: preserve-3d; }
        .base .face { background: var(--base-bg); color: var(--base-text); border: 1px solid rgba(0,0,0,0.1); }
        .base .front, .base .back { width: 440px; height: 70px; padding: 0 25px; justify-content: space-between; font-size: 38px; font-weight: bold; }
        .base .front { transform: translateZ(5px); }
        .base .back { transform: rotateY(180deg) translateZ(5px); }
        .base .top { width: 440px; height: 10px; top: 0; transform: rotateX(90deg) translateY(-5px); transform-origin: top; }
        .base .bottom { width: 440px; height: 10px; bottom: 0; transform: rotateX(-90deg) translateY(5px); transform-origin: bottom; }
        
        .mount { position: absolute; top: 0; width: 20px; height: 70px; transform-style: preserve-3d; }
        .mount-left { left: 0; }
        .mount-right { right: 0; }
        .mount .face { background: var(--mount-bg); border: 1px solid rgba(0,0,0,0.2); }
        .mount .front { width: 20px; height: 70px; transform: translateZ(9px); }
        .mount .back { width: 20px; height: 70px; transform: rotateY(180deg) translateZ(9px); }
        .mount .top { width: 20px; height: 18px; top: 0; transform: rotateX(90deg) translateY(-9px); transform-origin: top; }
        .mount .bottom { width: 20px; height: 18px; bottom: 0; transform: rotateX(-90deg) translateY(9px); transform-origin: bottom; }
        .mount .left { width: 18px; height: 70px; left: 0; transform: rotateY(-90deg) translateX(-9px); transform-origin: left; }
        .mount .right { width: 18px; height: 70px; right: 0; transform: rotateY(90deg) translateX(9px); transform-origin: right; }
        
        .door { position: absolute; top: -5px; left: 20px; width: 200px; height: 80px; transform-style: preserve-3d; transition: transform 0.1s linear; }
        .door .face { background: var(--door-bg); color: var(--door-text); border: 1px solid rgba(0,0,0,0.2); }
        .door .front, .door .back { width: 200px; height: 80px; font-size: 40px; font-weight: bold; }
        .door .front { transform: translateZ(11px); }
        .door .back { transform: rotateY(180deg) translateZ(11px); }
        .door .top { width: 200px; height: 22px; top: 0; transform: rotateX(90deg) translateY(-11px); transform-origin: top; }
        .door .bottom { width: 200px; height: 22px; bottom: 0; transform: rotateX(-90deg) translateY(11px); transform-origin: bottom; }
        .door .left { width: 22px; height: 80px; left: 0; transform: rotateY(-90deg) translateX(-11px); transform-origin: left; }
        .door .right { width: 22px; height: 80px; right: 0; transform: rotateY(90deg) translateX(11px); transform-origin: right; }
        
        .contour-effect { font-size: 42px; -webkit-text-stroke: 3.5px var(--door-text); paint-order: stroke fill; text-shadow: 2px 2px 0px var(--door-text), -2px -2px 0px var(--door-text); letter-spacing: -2px; }
        
        .light-mode-active .scene-container { background: #0a0a0a; }
        .light-mode-active .base .face, .light-mode-active .mount .face { background: #111; color: #fff; border-color: #222; }
        .light-mode-active .door .face { background: #222; color: #fff; border-color: #333; }
        .light-mode-active .base .front, .light-mode-active .base .back, .light-mode-active .door .front, .light-mode-active .door .back { text-shadow: 0 0 10px #fff, 0 0 20px #0ff; }
        .light-mode-active .contour-effect { -webkit-text-stroke: 0; text-shadow: 0 0 10px #fff, 0 0 20px #ff00ff !important; }
        
        .slider-container { background: white; padding: 10px; border-radius: 10px; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,0.05);}
        .slider-container label { font-size: 13px; font-weight: bold; color: #555;}
        input[type="range"] { width: 95%; margin-top: 5px; direction: ltr; }
        
        .controls { background: white; padding: 15px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); display: grid; grid-template-columns: 1fr 1fr; gap: 10px 15px; }
        .control-group { display: flex; flex-direction: column; }
        .control-group.full-width { grid-column: span 2; }
        .control-group label { margin-bottom: 4px; font-weight: bold; font-size: 12px; color: var(--primary); }
        .control-group select, .control-group input[type="text"], .control-group input[type="color"] { width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 6px; font-family: inherit; font-size: 13px; box-sizing: border-box; }
        .control-group input[type="color"] { padding: 2px; height: 35px; cursor: pointer; }
        
        .toggle-light { grid-column: span 2; display: flex; align-items: center; justify-content: center; gap: 8px; background: #fff3cd; padding: 10px; border-radius: 6px; font-size: 13px; font-weight: bold; cursor: pointer; border: 1px solid #ffeeba; }
        
        .btn-submit { background-color: var(--secondary); color: white; border: none; padding: 12px; font-size: 16px; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; font-family: inherit; transition: 0.3s;}
        .btn-submit:hover { background-color: #c0392b; }
        
        footer { background-color: var(--primary); padding: 12px; border-radius: 10px; display: flex; flex-direction: column; align-items: center; width: 100%; gap: 10px;}
        .social-links { display: flex; justify-content: space-around; width: 100%; }
        .social-links a { color: white; font-size: 20px; text-decoration: none; }
        .privacy-link { color: #bdc3c7; font-size: 13px; text-decoration: none; font-family: 'Cairo', sans-serif;}
        .privacy-link:hover { color: #fff; text-decoration: underline; }
        
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.6); justify-content: center; align-items: center; }
        .modal-content { background-color: #fff; padding: 25px; border-radius: 12px; width: 90%; max-width: 400px; display: flex; flex-direction: column; gap: 15px; position: relative; }
        .close-btn { position: absolute; top: 15px; left: 20px; font-size: 28px; cursor: pointer; color: #777; line-height: 1; }
        .modal-content h3 { margin: 0 0 10px 0; color: var(--primary); text-align: center; border-bottom: 2px solid #eee; padding-bottom: 10px;}
        .modal-content input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; font-family: inherit; box-sizing: border-box; font-size: 14px; }
    </style>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

    <div class="app-container" id="appBody">
        <header>
            <img src="logo.png" alt="لوجو فكرة خشبة" onerror="this.style.display='none'">
            <h1>فكرة خشبة</h1>
            <a href="/" style="font-size: 13px; color: inherit; font-family: 'Cairo', sans-serif;">← رجوع للمتجر</a>
        </header>

        <div class="scene-container" id="sceneContainer">
            <div class="rotate-wrapper" id="rotateWrapper">
                <div class="sign-wrapper" id="signWrapper">
                    <div class="mount mount-left">
                        <div class="face front"></div><div class="face back"></div>
                        <div class="face top"></div><div class="face bottom"></div>
                        <div class="face left"></div><div class="face right"></div>
                    </div>
                    <div class="base" id="signBase">
                        <div class="face front"><span id="fLeft">OPEN</span><span id="fRight">مفتوح</span></div>
                        <div class="face back"><span id="bLeft">مفتوح</span><span id="bRight">OPEN</span></div>
                        <div class="face top"></div><div class="face bottom"></div>
                    </div>
                    <div class="mount mount-right">
                        <div class="face front"></div><div class="face back"></div>
                        <div class="face top"></div><div class="face bottom"></div>
                        <div class="face left"></div><div class="face right"></div>
                    </div>
                    <div class="door" id="signDoor">
                        <div class="face front"><span class="dText">PULL</span></div>
                        <div class="face back"><span class="dText">PUSH</span></div>
                        <div class="face top"></div><div class="face bottom"></div>
                        <div class="face left"></div><div class="face right"></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="slider-container">
            <label>سحب الباب يمين / يسار</label>
            <input type="range" min="0" max="100" value="0" id="doorSlider">
        </div>

        <div class="controls">
            <label class="toggle-light">
                <input type="checkbox" id="lightMode">
                <span>تفعيل وضع الإضاءة الليلية (نيون)</span>
            </label>

            <div class="control-group">
                <label>الكلمة اليمنى</label>
                <select id="wordRight">
                    <option value="مفتوح">مفتوح</option>
                    <option value="مغلق">مغلق</option>
                    <option value="مغلق للصلاة">مغلق للصلاة</option>
                    <option value="OPEN">OPEN</option>
                    <option value="CLOSED">CLOSED</option>
                </select>
            </div>

            <div class="control-group">
                <label>الكلمة اليسرى</label>
                <select id="wordLeft">
                    <option value="OPEN">OPEN</option>
                    <option value="CLOSED">CLOSED</option>
                    <option value="مفتوح">مفتوح</option>
                    <option value="مغلق">مغلق</option>
                    <option value="مغلق للصلاة">مغلق للصلاة</option>
                </select>
            </div>

            <div class="control-group"><label>لون القاعدة</label><input type="color" id="baseColor" value="#f0f0f0"></div>
            <div class="control-group"><label>لون كلمات القاعدة</label><input type="color" id="baseTextColor" value="#333333"></div>

            <div class="control-group">
                <label>نص الباب المتحرك</label>
                <select id="doorAction">
                    <option value="PULL">PULL</option>
                    <option value="PUSH">PUSH</option>
                    <option value="CUSTOM">مخصص (أضف كونتور)</option>
                    <option value="NONE">بدون كلام</option>
                </select>
            </div>

            <div class="control-group"><label>لون الباب</label><input type="color" id="doorColor" value="#ffffff"></div>

            <div class="control-group full-width" id="customInputDiv" style="display: none;">
                <label>الكلمة المخصصة (عربي أو إنجليزي)</label>
                <input type="text" id="customText" placeholder="اكتب الكلمة هنا...">
            </div>

            <div class="control-group">
                <label>لون نص الباب</label>
                <select id="doorTextColorSelect">
                    <option value="#000000">أسود</option>
                    <option value="#FFD700">ذهبي</option>
                    <option value="PICKER">لون مخصص...</option>
                </select>
            </div>

            <div class="control-group" id="customColorDiv" style="display: none;">
                <label>اختر اللون المخصص</label>
                <input type="color" id="doorTextColorPicker" value="#e74c3c">
            </div>
        </div>

        <button class="btn-submit" onclick="openOrderModal()">إتمام الطلب الآن</button>

        <footer>
            <div class="social-links">
                <a href="https://www.facebook.com/fkrt.khshbh"><i class="fab fa-facebook"></i></a>
                <a href="https://www.instagram.com/fekrt_5shba/"><i class="fab fa-instagram"></i></a>
                <a href="https://wa.me/201069222150"><i class="fab fa-whatsapp"></i></a>
                <a href="https://www.tiktok.com/@fkret.khshba"><i class="fab fa-tiktok"></i></a>
            </div>
            <a href="/privacy" class="privacy-link">سياسة الخصوصية وحماية المستخدم</a>
        </footer>
    </div>

    <div id="orderModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeOrderModal()">&times;</span>
            <h3>تأكيد بيانات الطلب</h3>
            <label>الاسم بالكامل:</label>
            <input type="text" id="customerName" placeholder="اكتب اسمك هنا" required>
            <label>رقم الهاتف (للتواصل):</label>
            <input type="tel" id="customerPhone" placeholder="01xxxxxxxxx" required>
            <label>العنوان بالتفصيل:</label>
            <input type="text" id="customerAddress" placeholder="المحافظة، المنطقة، الشارع" required>
            <label>عدد القطع المطلوبة:</label>
            <input type="number" id="orderQuantity" value="1" min="1" required>
            <label>ملاحظات إضافية:</label>
            <input type="text" id="orderNotes" placeholder="أي ملاحظات خاصة بالتوصيل أو التصميم">
            <button class="btn-submit" style="background-color: #2ecc71; margin-top: 10px;" onclick="submitOrderToAdmin()">
                <i class="fas fa-check-circle"></i> تأكيد وإرسال الطلب
            </button>
        </div>
    </div>

    <script>
        // 👇 بيانات الـ Firebase الخاصة بيك 👇
        const firebaseConfig = {
            apiKey: "AIzaSyAvVMu2xPpZGY2acNzn2A9QfxnQy_J3IZI",
            authDomain: "open-close-11f8d.firebaseapp.com",
            databaseURL: "https://open-close-11f8d-default-rtdb.firebaseio.com",
            projectId: "open-close-11f8d",
            storageBucket: "open-close-11f8d.firebasestorage.app",
            messagingSenderId: "119135682864",
            appId: "1:119135682864:web:8096a9080ec2a1267e88f5"
        };
        // 👆 ---------------------------- 👆

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const root = document.documentElement;
        const appBody = document.getElementById('appBody');
        const signWrapper = document.getElementById('signWrapper');
        const rotateWrapper = document.getElementById('rotateWrapper');
        const sceneContainer = document.getElementById('sceneContainer');
        const signDoor = document.getElementById('signDoor');
        
        function resize3D() {
            const containerWidth = sceneContainer.offsetWidth;
            const scale = Math.min(0.9, containerWidth / 520);
            signWrapper.style.transform = `scale(${scale})`;
        }
        window.addEventListener('resize', resize3D);
        resize3D();

        function updateTexts() {
            const wR = document.getElementById('wordRight').value;
            const wL = document.getElementById('wordLeft').value;
            document.getElementById('fLeft').innerText = wL;
            document.getElementById('fRight').innerText = wR;
            document.getElementById('bLeft').innerText = wR;
            document.getElementById('bRight').innerText = wL;
        }
        document.getElementById('wordRight').addEventListener('change', updateTexts);
        document.getElementById('wordLeft').addEventListener('change', updateTexts);

        function updateDoor() {
            const action = document.getElementById('doorAction').value;
            const customDiv = document.getElementById('customInputDiv');
            const dTexts = document.querySelectorAll('.dText');
            let finalWord = "";
            let isCustom = false;

            if (action === 'CUSTOM') {
                customDiv.style.display = 'block';
                finalWord = document.getElementById('customText').value;
                isCustom = true;
            } else {
                customDiv.style.display = 'none';
                finalWord = action === 'NONE' ? "" : action;
            }

            dTexts.forEach(el => {
                el.innerText = finalWord;
                if(isCustom && finalWord.trim() !== "") { el.classList.add('contour-effect'); } 
                else { el.classList.remove('contour-effect'); }
            });
        }
        document.getElementById('doorAction').addEventListener('change', updateDoor);
        document.getElementById('customText').addEventListener('input', updateDoor);

        const doorTextSelect = document.getElementById('doorTextColorSelect');
        const doorTextPicker = document.getElementById('doorTextColorPicker');
        const customColorDiv = document.getElementById('customColorDiv');

        function updateColors() {
            root.style.setProperty('--base-bg', document.getElementById('baseColor').value);
            root.style.setProperty('--base-text', document.getElementById('baseTextColor').value);
            root.style.setProperty('--door-bg', document.getElementById('doorColor').value);
            root.style.setProperty('--mount-bg', document.getElementById('baseColor').value);

            let dtColor = doorTextSelect.value;
            if (dtColor === 'PICKER') {
                customColorDiv.style.display = 'flex';
                dtColor = doorTextPicker.value;
            } else { customColorDiv.style.display = 'none'; }
            root.style.setProperty('--door-text', dtColor);
        }

        document.getElementById('baseColor').addEventListener('input', updateColors);
        document.getElementById('baseTextColor').addEventListener('input', updateColors);
        document.getElementById('doorColor').addEventListener('input', updateColors);
        doorTextSelect.addEventListener('change', updateColors);
        doorTextPicker.addEventListener('input', updateColors);

        document.getElementById('lightMode').addEventListener('change', function() {
            if(this.checked) appBody.classList.add('light-mode-active');
            else appBody.classList.remove('light-mode-active');
        });

        document.getElementById('doorSlider').addEventListener('input', function() {
            let moveX = (this.value / 100) * 240;
            signDoor.style.transform = `translateX(${moveX}px)`;
        });

        let isDragging = false, prevX = 0, prevY = 0, rotX = 0, rotY = 0;
        function startDrag(e) { isDragging = true; prevX = e.clientX || e.touches[0].clientX; prevY = e.clientY || e.touches[0].clientY; }
        function drag(e) {
            if (!isDragging) return; e.preventDefault(); 
            let clientX = e.clientX || e.touches[0].clientX; let clientY = e.clientY || e.touches[0].clientY;
            let deltaX = clientX - prevX; let deltaY = clientY - prevY;
            rotY += deltaX * 0.8; rotX -= deltaY * 0.8; rotX = Math.max(-35, Math.min(35, rotX));
            rotateWrapper.style.transform = `rotateX(${rotX}deg) rotateY(${rotY}deg)`;
            prevX = clientX; prevY = clientY;
        }
        function endDrag() { isDragging = false; }
        sceneContainer.addEventListener('mousedown', startDrag);
        document.addEventListener('mousemove', drag);
        document.addEventListener('mouseup', endDrag);
        sceneContainer.addEventListener('touchstart', startDrag, {passive: false});
        document.addEventListener('touchmove', drag, {passive: false});
        document.addEventListener('touchend', endDrag);

        function openOrderModal() { document.getElementById('orderModal').style.display = 'flex'; }
        function closeOrderModal() { document.getElementById('orderModal').style.display = 'none'; }

        // إرسال البيانات مباشرة إلى سحابة جوجل Firebase
        function submitOrderToAdmin() {
            const name = document.getElementById('customerName').value.trim();
            const phone = document.getElementById('customerPhone').value.trim();
            const address = document.getElementById('customerAddress').value.trim();
            const qty = document.getElementById('orderQuantity').value;
            const notes = document.getElementById('orderNotes').value.trim();
            const isLight = document.getElementById('lightMode').checked;

            if(!name || !phone || !address) { alert("برجاء استكمال البيانات الأساسية!"); return; }

            let dAction = document.getElementById('doorAction').value;
            if(dAction === 'CUSTOM') dAction = document.getElementById('customText').value;

            const orderId = Date.now();
            const orderData = {
                id: orderId, name: name, phone: phone, address: address, qty: qty, notes: notes,
                baseDetails: `${document.getElementById('wordRight').value} / ${document.getElementById('wordLeft').value}`,
                baseColor: document.getElementById('baseColor').value,
                baseTextColor: document.getElementById('baseTextColor').value,
                doorDetails: dAction, doorColor: document.getElementById('doorColor').value,
                doorTextColor: document.getElementById('doorTextColorSelect').value === 'PICKER' ? document.getElementById('doorTextColorPicker').value : document.getElementById('doorTextColorSelect').value,
                isLight: isLight, paid: "", 
                status: { pen: false, cam: false, truck: false },
                rowColor: "#ffffff", pinned: false, adminComment: ""
            };

            db.ref('orders/' + orderId).set(orderData, (error) => {
                if (error) { alert("حدث خطأ أثناء إرسال الطلب، يرجى المحاولة مرة أخرى."); } 
                else {
                    alert(`تم إرسال الطلب بنجاح ${isLight ? '(اللوحة مضيئة)' : ''} وسوف نتواصل معك قريباً!`);
                    closeOrderModal();
                    document.getElementById('customerName').value = '';
                    document.getElementById('customerPhone').value = '';
                    document.getElementById('customerAddress').value = '';
                    document.getElementById('orderNotes').value = '';
                }
            });
        }
    </script>
</body>
</html>
